<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class=" flex items-center justify-center m-8">
      <form action="#" method="POST" class="bg-white border border-neutral-300 rounded-xl p-8 flex flex-col gap-6 w-full sm:w-96 ">
        
        <div class="text-center">
            <h1 class="text-2xl font-bold text-neutral-900">Criar conta</h1>
            <p class="text-sm text-neutral-500 mt-1">Preencha seus dados</p>
        </div>

        <div class="flex flex-col gap-2">
            <label for="name" class="text-sm font-medium text-neutral-700">Nome</label>
            <input type="text" placeholder="Seu nome" class="h-10 px-3 border border-neutral-300 rounded-lg outline-none placeholder:text-neutral-400 text-sm">
        </div>

        <div class="flex flex-col gap-2">
            <label for="email" class="text-sm font-medium text-neutral-700">E-mail</label>
            <input type="email" placeholder="voce@gmail.com" class="h-10 px-3 border border-neutral-300 rounded-lg outline-none placeholder:text-neutral-400  text-sm"">
        </div>

        <div class="flex flex-col gap-2">
            <label for="password" class="text-sm font-medium text-neutral-700">Senha</label>
            <input type="password" id="password" name="password" placeholder="********" required
                class="h-10 px-3 border border-neutral-300 rounded-lg outline-none placeholder:text-neutral-400  text-sm">
        </div>

        <button type="submit" 
            class="h-10 bg-neutral-900 text-white font-medium rounded-lg cursor-pointer hover:bg-neutral-700 transition-colors text-sm">
            Cadastrar
        </button>

        <p class="text-sm text-neutral-600 text-center">
           Já tem uma conta? 
            <a href="login.html" class="text-neutral-900 font-medium hover:underline">Entrar</a>
        </p>

    </form>
</body>
</html>
